<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#3d8b83" />
<title>弱視トレーニング記録</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <main>
    <!-- 記録画面（今日 / カレンダーから選んだ日） -->
    <section id="view-day" class="view active">
      <div class="day-header">
        <h1 id="day-date-label">-</h1>
        <button id="back-to-today-btn" class="btn-link hidden">今日に戻る</button>
      </div>

      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
          <circle id="ring-progress" class="ring-progress" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="ring-label">
          <span id="ring-minutes">0</span><span class="ring-unit">分</span>
          <div id="ring-goal-text" class="ring-goal-text">/ 目標120分</div>
          <div id="ring-percent" class="ring-percent">0%</div>
        </div>
      </div>

      <div class="field-block">
        <label for="minutes-input">アイパッチ装着時間（分）</label>
        <input type="number" id="minutes-input" inputmode="numeric" min="0" step="1" />
      </div>

      <div class="quick-buttons">
        <button type="button" class="btn-quick" data-add="15">+15分</button>
        <button type="button" class="btn-quick" data-add="30">+30分</button>
      </div>

      <div class="field-block">
        <label for="memo-input">訓練内容メモ（任意）</label>
        <textarea id="memo-input" rows="3" placeholder="例：テレビを見ながら"></textarea>
      </div>

      <p id="save-status" class="save-status" aria-live="polite">&nbsp;</p>
    </section>

    <!-- カレンダー画面 -->
    <section id="view-calendar" class="view">
      <div class="calendar-header">
        <button id="cal-prev" class="btn-icon" aria-label="前の月">←</button>
        <h2 id="cal-title">-</h2>
        <button id="cal-next" class="btn-icon" aria-label="次の月">→</button>
      </div>
      <div class="calendar-weekdays">
        <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
      </div>
      <div id="calendar-grid" class="calendar-grid"></div>
      <div class="legend">
        <span class="legend-item"><span class="legend-dot dot-achieved"></span>目標達成</span>
        <span class="legend-item"><span class="legend-dot dot-partial"></span>記録あり</span>
        <span class="legend-item"><span class="legend-dot dot-none"></span>記録なし</span>
      </div>
    </section>

    <!-- 設定画面 -->
    <section id="view-settings" class="view">
      <h2>設定</h2>

      <div class="field-block">
        <label for="goal-input">1日の目標時間（分）</label>
        <input type="number" id="goal-input" inputmode="numeric" min="1" step="1" />
      </div>
      <button id="goal-save-btn" class="btn-primary">目標を保存</button>

      <hr />

      <h2>バックアップ</h2>
      <p class="settings-note">記録はすべてこの端末の中だけに保存されています。機種変更や万一に備えて、ときどきファイルに書き出しておくことをおすすめします。</p>
      <button id="export-btn" class="btn-secondary">JSONファイルに書き出す</button>
      <button id="import-btn" class="btn-secondary">JSONファイルから読み込む</button>
      <input type="file" id="import-file" accept="application/json,.json" class="hidden" />
      <p id="backup-status" class="save-status" aria-live="polite">&nbsp;</p>
    </section>
  </main>

  <nav id="bottom-nav">
    <button type="button" class="nav-btn active" data-view="day">
      <span class="nav-icon">📝</span><span class="nav-text">今日</span>
    </button>
    <button type="button" class="nav-btn" data-view="calendar">
      <span class="nav-icon">📅</span><span class="nav-text">カレンダー</span>
    </button>
    <button type="button" class="nav-btn" data-view="settings">
      <span class="nav-icon">⚙️</span><span class="nav-text">設定</span>
    </button>
  </nav>
</div>

<script src="app.js"></script>
</body>
</html>
